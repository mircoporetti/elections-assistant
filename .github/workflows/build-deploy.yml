name: Build and deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NAMESPACE: elections-assistant

jobs:
  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image names
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max

  deploy:
    name: Deploy to cluster
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, elections-assistant]
    timeout-minutes: 60
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Check kubeconfig is available
        env:
          KUBECONFIG: ${{ vars.KUBECONFIG_PATH }}
        run: |
          if [ -z "${KUBECONFIG:-}" ]; then
            echo "::error::Variable KUBECONFIG_PATH is not set in the Production environment"
            exit 1
          fi
          if [ ! -r "$KUBECONFIG" ]; then
            echo "::error::Runner cannot read kubeconfig at $KUBECONFIG"
            exit 1
          fi

      - name: Apply manifests
        env:
          KUBECONFIG: ${{ vars.KUBECONFIG_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          sed -i "s|\$IMAGE|$IMAGE|g" k8s/stateful_set.yml
          kubectl -n "$NAMESPACE" apply -f k8s/stateful_set.yml
          kubectl -n "$NAMESPACE" apply -f k8s/service.yml
          kubectl -n "$NAMESPACE" rollout status statefulset/elections-assistant --timeout=45m

      - name: Report running pods
        if: always()
        env:
          KUBECONFIG: ${{ vars.KUBECONFIG_PATH }}
        run: kubectl -n "$NAMESPACE" get pods -o wide